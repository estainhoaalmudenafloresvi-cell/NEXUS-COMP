name: Importar NEXUS completo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-nexus.yml"
      - "SqlSaveRepository.cs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar-proyecto:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio destino
        uses: actions/checkout@v4

      - name: Copiar proyecto completo desde NEXUS-V2
        shell: bash
        run: |
          set -euo pipefail
          cp SqlSaveRepository.cs /tmp/SqlSaveRepository.latest.cs
          git clone --depth 1 https://github.com/estainhoaalmudenafloresvi-cell/NEXUS-V2.git /tmp/NEXUS-V2
          rsync -a --exclude='.git' --exclude='.github/workflows/***' /tmp/NEXUS-V2/ ./
          cp /tmp/SqlSaveRepository.latest.cs SqlSaveRepository.cs
          rm -f prueba.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Importar proyecto NEXUS completo y actualizar persistencia SQL"
            git push
          fi
