<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-labelledby="title desc">
<title id="title">Paleta visual de NEXUS</title>
<desc id="desc">Seis muestras de color utilizadas en la interfaz: ink, violet, lavender, pink, cyan y white.</desc>
<rect width="900" height="190" rx="22" fill="#120B22"/>
<text x="34" y="38" fill="#FAF1FF" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">NEXUS · INTERFACE PALETTE</text>
<g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
<rect x="34" y="58" width="126" height="82" rx="12" fill="#120B22" stroke="#FAF1FF" stroke-opacity=".45"/><text x="97" y="161" fill="#FAF1FF">INK</text><text x="97" y="178" fill="#CCB2F5" font-size="11">#120B22</text>
<rect x="178" y="58" width="126" height="82" rx="12" fill="#2E1C48"/><text x="241" y="161" fill="#FAF1FF">VIOLET</text><text x="241" y="178" fill="#CCB2F5" font-size="11">#2E1C48</text>
<rect x="322" y="58" width="126" height="82" rx="12" fill="#CCB2F5"/><text x="385" y="161" fill="#FAF1FF">LAVENDER</text><text x="385" y="178" fill="#CCB2F5" font-size="11">#CCB2F5</text>
<rect x="466" y="58" width="126" height="82" rx="12" fill="#FAB1DC"/><text x="529" y="161" fill="#FAF1FF">PINK</text><text x="529" y="178" fill="#CCB2F5" font-size="11">#FAB1DC</text>
<rect x="610" y="58" width="126" height="82" rx="12" fill="#85E4FF"/><text x="673" y="161" fill="#FAF1FF">CYAN</text><text x="673" y="178" fill="#CCB2F5" font-size="11">#85E4FF</text>
<rect x="754" y="58" width="112" height="82" rx="12" fill="#FAF1FF"/><text x="810" y="161" fill="#FAF1FF">WHITE</text><text x="810" y="178" fill="#CCB2F5" font-size="11">#FAF1FF</text>
</g></svg>